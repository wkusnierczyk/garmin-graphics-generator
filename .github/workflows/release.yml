# A `v*` tag push becomes a *draft* GitHub release with the sdist and the wheel
# attached (#23). The notes are not generated here: they are written by hand, in
# the release PR's description, and put on the draft when it is published:
#
#   git tag -a vX.Y.Z -m 'Release X.Y.Z' && git push origin vX.Y.Z
#   # once the workflow has run: `gh release view vX.Y.Z` shows the draft
#   gh release edit vX.Y.Z --title 'vX.Y.Z <summary>' --notes-file notes.md --draft=false
#
# A draft, so that publishing stays a decision taken with the notes in hand,
# rather than something a tag push does with GitHub's generated ones.
#
# Every action is pinned to a commit SHA: this job holds a contents: write token,
# and a tag like v7 is a mutable pointer.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # A tag is a name someone typed; nothing about `git tag` reads pyproject.toml,
      # and the built files are named after pyproject.toml's version.
      - name: Check the tag against pyproject.toml
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml's version $version"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # GH_REPO, because gh does not read GITHUB_REPOSITORY.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME"
